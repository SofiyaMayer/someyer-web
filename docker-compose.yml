services:
  payload:
    image: node:22.17.0-alpine
    # Matches the host uid 1000 so files written into the bind-mounted repo stay writable outside Docker
    user: node
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "corepack pnpm install && corepack pnpm dev"
    depends_on:
      node_modules-owner:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # .env points at 127.0.0.1 for running outside Docker; inside the network the host is the service name
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-someyer-web}

  # Docker creates a new named volume's mount point as root, so payload (running as node) could not install into it
  node_modules-owner:
    image: node:22.17.0-alpine
    volumes:
      - node_modules:/home/node/app/node_modules
    command: chown node:node /home/node/app/node_modules

  postgres:
    image: postgres:17-alpine
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-someyer-web}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - data:/var/lib/postgresql/data

volumes:
  data:
  node_modules:
